<div class="cl-head"><span class="cl-badge">OCTOBER</span><h1>قائمة أكتوبر للأمن السيبراني</h1><p class="cl-sub">ثماني خطوات بسيطة لشهر التوعية بالأمن السيبراني. اطبعها، علّقها، وشاركها في عملك أو مدرستك أو بيتك.</p><button class="printbtn" onclick="window.print()">&#128424; اطبع القائمة</button></div>
<ul class="cl-list">
<li><label><input type="checkbox"><span class="box"></span><span class="txt">فعّلت المصادقة الثنائية على بريدي وحساباتي المهمة</span></label></li>
<li><label><input type="checkbox"><span class="box"></span><span class="txt">جعلت كلمة المرور قوية ومختلفة لكل حساب</span></label></li>
<li><label><input type="checkbox"><span class="box"></span><span class="txt">بدأت باستخدام مدير كلمات المرور</span></label></li>
<li><label><input type="checkbox"><span class="box"></span><span class="txt">صرت أتحقق من الروابط والمرفقات قبل فتحها</span></label></li>
<li><label><input type="checkbox"><span class="box"></span><span class="txt">فعّلت التحديث التلقائي في هاتفي وحاسوبي</span></label></li>
<li><label><input type="checkbox"><span class="box"></span><span class="txt">أخذت نسخة احتياطية من ملفاتي المهمة</span></label></li>
<li><label><input type="checkbox"><span class="box"></span><span class="txt">راجعت إعدادات الخصوصية في حساباتي</span></label></li>
<li><label><input type="checkbox"><span class="box"></span><span class="txt">شاركت نصيحة أمان مع شخص أحبه</span></label></li>
</ul>
